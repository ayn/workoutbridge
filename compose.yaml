x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${WORKOUTBRIDGE_DOMAIN:?Set private HTTPS hostname}
      CF_API_TOKEN: ${CF_API_TOKEN:?Set DNS challenge token}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    pids_limit: 128
    logging: *bounded-logs
    depends_on:
      web:
        condition: service_healthy

  tailscale:
    image: tailscale/tailscale:v1.104.4
    restart: unless-stopped
    network_mode: service:caddy
    depends_on:
      caddy:
        condition: service_started
        restart: true
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${WORKOUTBRIDGE_PRIVATE_DIR:?Set private data directory}/tailscale:/var/lib/tailscale
    environment:
      TS_AUTH_ONCE: "true"
      # Allow interactive authorization without rotating the login URL every minute.
      TS_BOOT_TIMEOUT: "30m"
      TS_ACCEPT_DNS: "false"
      TS_HOSTNAME: workoutbridge
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    mem_limit: 256m
    pids_limit: 128
    logging: *bounded-logs

  web:
    build: .
    image: workoutbridge:${WORKOUTBRIDGE_REVISION:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:1879:8000"
    environment:
      WORKOUTBRIDGE_ORIGIN: ${WORKOUTBRIDGE_ORIGIN:?Set tailnet HTTPS origin}
      WORKOUTBRIDGE_DATA_DIR: /data/web
      WORKOUTBRIDGE_CONFIG_DIR: /data/config
      WORKOUTBRIDGE_PASSWORD_FILE: /data/access-password
    volumes:
      - ${WORKOUTBRIDGE_PRIVATE_DIR:?Set private data directory}:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; from urllib.parse import urlsplit; r=urllib.request.Request('http://127.0.0.1:8000/health',headers={'Host':urlsplit(os.environ['WORKOUTBRIDGE_ORIGIN']).netloc}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  caddy-data:
  caddy-config:
