name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.21
      - run: uv sync --locked --extra garmin --python "${{ matrix.python }}"
      - run: uv run --locked --extra garmin ruff check workoutbridge tests
      - run: uv run --locked --extra garmin ruff format --check workoutbridge tests
      - run: uv run --locked --extra garmin python -m unittest discover -s tests -v
