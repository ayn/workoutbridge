name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  diy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.21
      - run: uv sync --locked --extra web
      - run: uv run --locked --extra web python scripts/diy_smoke.py
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.21
      - run: uv sync --locked --extra garmin --extra coros --extra web --python "${{ matrix.python }}"
      - run: uv run --locked --extra garmin --extra coros --extra web ruff check workoutbridge tests scripts
      - run: uv run --locked --extra garmin --extra coros --extra web ruff format --check workoutbridge tests scripts
      - run: uv run --locked --extra garmin --extra coros --extra web python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
