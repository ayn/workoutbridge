<VirtualHost *:80>
    ServerName prescribed.fit
    DocumentRoot /var/www/prescribed-acme
    <Directory /var/www/prescribed-acme>
        Require all granted
        Options -Indexes
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://prescribed.fit%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName prescribed.fit
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/prescribed.fit/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/prescribed.fit/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:1879/ connectiontimeout=5 timeout=180
    ProxyPassReverse / http://127.0.0.1:1879/
    ErrorLog ${APACHE_LOG_DIR}/prescribed-error.log
    # Omit query strings and headers, which can carry sensitive data.
    CustomLog ${APACHE_LOG_DIR}/prescribed-access.log "%h %l %u %t \"%m %U %H\" %>s %b"
</VirtualHost>
