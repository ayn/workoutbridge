[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workoutbridge"
version = "0.1.0"
description = "Reviewable structured workouts from plain-text prescriptions"
readme = "README.md"
keywords = [
    "finalsurge", "google-calendar", "icalendar", "garmin", "garmin-connect",
    "training", "running", "coaching", "structured-workouts",
]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "icalendar>=6,<8",
    "recurring-ical-events>=3,<4",
]

[project.urls]
Repository = "https://github.com/ayn/workoutbridge"
Issues = "https://github.com/ayn/workoutbridge/issues"

[project.scripts]
workoutbridge = "workoutbridge.cli:main"

[project.optional-dependencies]
garmin = [
    "garminconnect==0.3.19 ; python_full_version >= '3.12'",
]

[tool.setuptools.packages.find]
include = ["workoutbridge*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "BLE"]

[dependency-groups]
dev = [
    "ruff==0.17.1",
]
