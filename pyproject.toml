[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workoutbridge"
version = "0.1.0"
description = "Reviewable structured workouts from plain-text prescriptions"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
workoutbridge = "workoutbridge.cli:main"

[tool.setuptools.packages.find]
include = ["workoutbridge*"]
